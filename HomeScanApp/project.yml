name: HomeScan
options:
  minimumXcodeGenVersion: 2.38
  deploymentTarget:
    iOS: "17.0"
targets:
  HomeScan:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - Info.plist
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homescan.app
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    frameworks:
      - RoomPlan.framework
      - ARKit.framework
      - RealityKit.framework
