name: Build HomeScan

on:
  push:
    paths:
      - "HomeScanApp/**"
      - ".github/workflows/homescan-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: HomeScanApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild             -project HomeScan.xcodeproj             -scheme HomeScan             -sdk iphonesimulator             -destination "generic/platform=iOS Simulator"             CODE_SIGNING_ALLOWED=NO             build
